<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport", content="width=device-width, initial-scale=1.0">
        <title>Breakout GAME - BY NIDHI UPMAN</title>
        <link rel="stylesheet" href="breakout.css">
        <script src="breakout.js"></script>
    </head>
    <div>
        <center>
            <h1>Breakout GAME - BY NIDHI UPMAN</h1>
        </center>
    </div>
    <body>
        <div id="mainMenu" class="menu">
            <h2>主菜单</h2>
            <button id="startGameBtn">开始游戏</button>
            <button id="selectLevelBtn">选择关卡</button>
        </div>
        
        <div id="levelSelect" class="menu" style="display: none;">
            <h2>选择关卡</h2>
            <button id="level1Btn">第 1 关</button>
            <button id="level2Btn">第 2 关</button>
            <button id="level3Btn">第 3 关</button>
            <button id="backToMenuBtn">返回主菜单</button>
        </div>
        
        <canvas id="board"></canvas>
    </body>
</html>
